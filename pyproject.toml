[project]
name = "crux"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "packaging==26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
